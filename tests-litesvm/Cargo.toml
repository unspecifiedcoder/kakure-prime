# Deliberately NOT a member of the root workspace (see [workspace] below,
# which makes this its own workspace root): `cargo build-sbf` resolves the
# full dependency graph of whatever workspace a crate belongs to, and
# litesvm's dependency tree pulls a `zeroize` version whose `zeroize_derive`
# requires Cargo's `edition2024` feature -- unsupported by the older cargo
# (1.84.0) bundled with Solana's platform-tools v1.51. Keeping the litesvm
# test harness in its own workspace means `cargo build-sbf` never sees
# litesvm's dependency graph at all.
[workspace]
members = ["."]

[package]
name = "kakure_pool_litesvm_tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
kakure_pool = { path = "../programs/kakure_pool", features = ["no-entrypoint"] }
solana-program = "2"
borsh = "1.5"
spl-associated-token-account = { version = "8", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.16"
litesvm-token = "0.16"
solana-sdk = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
# litesvm's `send_transaction` wants `impl Into<VersionedTransaction>` from
# ITS OWN solana-transaction 4.1.6 (there are two incompatible
# solana-transaction majors resolved in this graph -- solana-sdk 3.0.0's own
# `transaction` module wraps the older 3.1.0 one). Build transactions with
# this crate directly so the conversion is available.
solana-transaction = "4.1.6"
solana-transaction-error = "3"
solana-instruction-error = "2"
# For building a raw Token-2022 Mint account fixture matching exactly the
# crate versions `litesvm_token::spl_token` (= spl-token-interface, no
# "token-2022" feature) itself depends on -- there are multiple
# incompatible major versions of these three crates in this graph, and the
# ones spl-token-interface uses are not the ones solana-sdk/solana-program
# re-export.
solana-program-pack = "3"
solana-program-option = "3"
solana-account = "4"
# Host-side Groth16 proof compression for building `[u8; 192]` compressed
# proof fixtures (workstream G wire format) -- this workspace has no
# `cargo build-sbf` edition2024 constraint (see the top-of-file note), so
# any 3.x is fine here.
solana-bn254 = "3"
