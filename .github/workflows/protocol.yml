name: Protocol verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "circuits/**"
      - "programs/**"
      - "tests-litesvm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/protocol.yml"

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuit-kats:
    name: Circuit known-answer tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kakure/circuits test

  reproducible-programs:
    name: Reproducible Solana programs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned protocol toolchain
        env:
          SKIP_ARTIFACTS: "1"
        run: bash scripts/bootstrap.sh
      - name: Install task runner
        run: cargo install just --locked
      - name: Rebuild and compare committed programs
        run: just verify-programs-reproducible
