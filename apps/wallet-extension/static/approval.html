<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review request · Kakure Wallet</title><link rel="stylesheet" href="wallet.css"></head>
<body>
  <main>
    <header><div class="brand"><span class="mark">K</span><div><strong>Kakure Wallet</strong><small>SIGNATURE REVIEW</small></div></div><span class="network">REVIEW</span></header>
    <section class="hero compact"><span id="method" class="eyebrow">REQUEST</span><h1>Approve only what you understand.</h1></section>
    <section class="panel review"><span class="step">REQUESTING SITE</span><strong id="origin">Loading…</strong><p id="detail">Reading request details…</p><div class="warning">Your secret key never leaves this extension. Only the reviewed payload is signed.</div></section>
    <div class="approval-actions"><button id="reject" class="secondary" type="button">Reject</button><button id="approve" type="button">Approve & sign <b>→</b></button></div>
  </main>
  <script src="approval.js"></script>
</body>
</html>
